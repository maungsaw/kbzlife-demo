name: demo_ui
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1
  intl: ^0.20.2
  go_router: ^18.0.0
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.5
  signature: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/brand-mark.png
    - assets/products/

# --- Native Splash Configuration ---
flutter_native_splash:
  color: "#0B2545"               # Background color of the native screen
  image: assets/brand-mark.png   # Your graphic icon logo
  
  # Android 12+ specific settings
  android_12:
    color: "#0B2545"
    image: assets/brand-mark.png